stages:
  - triggers

homelab:
  stage: triggers
  trigger:
    include: .gitlab/homelab.yml
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab/homelab.yml
        - src/docker/**/*.yml
        - src/docker/**/*.yaml

documentation:
  stage: triggers
  trigger:
    include: .gitlab/documentation.yml
    strategy: depend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab/documentation.yml
        - src/docs/**/*
