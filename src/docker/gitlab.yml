---
x-labels: &default-labels
  com.centurylinklabs.watchtower.enable: true
  container.label.group: management

x-limits: &resource-limits
  restart: always
  networks:
    frontend:

name: gitlab
services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    hostname: gitlab.${PRIVATE_DOMAIN}
    platform: linux/amd64
    <<: *resource-limits
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      TZ: ${TIME_ZONE?:TIME_ZONE is missing in Bitwarden}
      #GITLAB_OMNIBUS_CONFIG:
    volumes:
      - type: bind
        source: ${DOCKER_FOLDER_PATH?:Error - DOCKER_FOLDER_PATH is missing in Bitwarden}/gitlab/config
        target: /etc/gitlab
      - type: bind
        source: ${DOCKER_FOLDER_PATH}/gitlab/logs
        target: /var/log/gitlab
      - type: bind
        source: ${DOCKER_FOLDER_PATH}/gitlab/data
        target: /var/opt/gitlab
      - type: bind
        source: /etc/timezone
        target: /etc/timezone
        read_only: true
    labels:
      <<: *default-labels
      management: dashboard
      traefik.enable: true
      traefik.http.routers.gitlab.rule: Host(`gitlab.${PRIVATE_DOMAIN}`)
      traefik.http.routers.gitlab.entrypoints: websecure
      traefik.http.routers.gitlab.tls.certresolver: le
      traefik.http.routers.gitlab.service: gitlab
      traefik.http.services.gitlab.loadbalancer.server.port: 80
      traefik.http.routers.gitlab-registry.rule: Host(`registry.${PRIVATE_DOMAIN}`)
      traefik.http.routers.gitlab-registry.entrypoints: websecure
      traefik.http.routers.gitlab-registry.tls.certresolver: le
      traefik.http.routers.gitlab-registry.service: gitlab-registry
      traefik.http.services.gitlab-registry.loadbalancer.server.port: 5050
      traefik.http.routers.gitlab-pages.rule: Host(`pages.${PRIVATE_DOMAIN}`) || HostRegexp(`^[a-z0-9-]+\.pages\.${PRIVATE_DOMAIN}$$`)
      traefik.http.routers.gitlab-pages.entrypoints: websecure
      traefik.http.routers.gitlab-pages.tls.certresolver: le
      traefik.http.routers.gitlab-pages.tls.domains[0].main: pages.${PRIVATE_DOMAIN}
      traefik.http.routers.gitlab-pages.tls.domains[0].sans: "*.pages.${PRIVATE_DOMAIN}"
      traefik.http.routers.gitlab-pages.service: gitlab-pages
      traefik.http.services.gitlab-pages.loadbalancer.server.port: 8091
      traefik.tcp.routers.gitlab-ssh.entrypoints: ssh
      traefik.tcp.routers.gitlab-ssh.rule: HostSNI(`*`)
      traefik.tcp.routers.gitlab-ssh.service: gitlab-ssh
      traefik.tcp.services.gitlab-ssh.loadbalancer.server.port: 22

networks:
  frontend:
    external: true
