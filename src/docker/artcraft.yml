---
x-labels: &default-labels
  com.centurylinklabs.watchtower.enable: true
  container.label.group: monitoring

x-limits: &resource-limits
  restart: unless-stopped
  networks:
    frontend:

services:
  artcraft:
    image: nginx
    container_name: artcraft
    hostname: artcraft.${PRIVATE_DOMAIN}
    platform: linux/amd64
    <<: *resource-limits
    volumes:
      - type: bind
        source: ${DOCKER_FOLDER_PATH?:Error - DOCKER_FOLDER_PATH is missing in Bitwarden}/artcraft
        target: /usr/share/nginx/html
        read_only: true
      - type: bind
        source: /etc/timezone
        target: /etc/timezone
        read_only: true
    labels:
      <<: *default-labels
      drawing: dashboard
      traefik.enable: true
      traefik.http.routers.artcraft.rule: Host(`artcraft.${PRIVATE_DOMAIN}`)
      traefik.http.routers.artcraft.entrypoints: websecure
      traefik.http.routers.artcraft.tls.certresolver: le
      traefik.http.services.artcraft.loadbalancer.server.port: 80

networks:
  frontend:
    external: true
